version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: secure_auth_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: secure_auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: secure_auth_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: "prod-secret-key-change-this-production-hex-key-minimum-32-chars"
      DATABASE_URL: "postgresql+asyncpg://postgres:secure_password_123@db:5432/secure_auth_db"
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"

volumes:
  postgres_data:
